[package]
name = "cue-cli"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Independent command-line client for the Cue service"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3", features = ["json"] }

[[bin]]
name = "cue"
path = "src/main.rs"


