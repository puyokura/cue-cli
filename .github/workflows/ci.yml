name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build from the repository root
        run: cargo build --release --locked
      - name: unit tests
        run: cargo test --locked
      - name: cli help and version (exit codes are part of the contract)
        run: |
          ./target/release/cue help  > /dev/null
          ./target/release/cue version
      - name: documented counts match the files
        run: python3 tests/check_docs.py

      - name: smoke (network)
        run: python3 tests/run_smoke.py ./target/release/cue
        continue-on-error: true


