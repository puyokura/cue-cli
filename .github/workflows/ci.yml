name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release --locked
      - name: unit tests
        run: cargo test --locked
      - name: cli help
        run: ./target/release/cue help || true
      - name: smoke (network)
        run: python3 tests/run_smoke.py ./target/release/cue
        continue-on-error: true
